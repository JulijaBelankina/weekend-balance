<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f6f0e7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Weekend Balance" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Weekend Balance</title>
  <style>
    :root{--paper:#f6f0e7;--ink:#1e211b;--muted:#817d74;--line:#e4ddd2;--social:#dda08f;--solo:#aab39a;--practical:#e7bd6f;--hobbies:#aebbc4;--rest:#c8afd0;--unassigned:#d4d0c8;--card:#fbf8f2}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button{font:inherit;color:inherit}
    body{min-height:100dvh}.app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(82px + env(safe-area-inset-bottom));position:relative}.screen{display:none}.screen.active{display:block}
    h1,.month-title,.sheet-title{font-family:Georgia,"Times New Roman",serif;font-weight:500}.calendar-screen{padding-top:22px}.month-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:8px 4px 28px}.month-title{text-align:center;font-size:29px}.nav-btn{border:0;background:#ebe5dc;width:42px;height:42px;border-radius:50%;font-size:27px;line-height:1}.nav-btn:disabled{opacity:.25}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekdays{margin-bottom:9px;color:#77736b;font-size:13px;text-align:center}.day{aspect-ratio:.82;border:0;border-radius:10px;background:rgba(255,255,255,.46);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:9px 2px 4px;gap:7px;font-size:17px}.day.weekday{color:#5f5c56}.day.outside{opacity:.3}.day.weekend{cursor:pointer}.day .icon{font-size:19px;line-height:1}.day.social{background:color-mix(in srgb,var(--social) 75%,white)}.day.solo{background:color-mix(in srgb,var(--solo) 75%,white)}.day.practical{background:color-mix(in srgb,var(--practical) 72%,white)}.day.hobbies{background:color-mix(in srgb,var(--hobbies) 72%,white)}.day.rest{background:color-mix(in srgb,var(--rest) 72%,white)}.day.unassigned{background:color-mix(in srgb,var(--unassigned) 68%,white)}
    .balance-screen{padding:36px 6px 0}.balance-screen h1{font-size:46px;margin:0 0 28px}.balance-sub{font-family:Georgia,"Times New Roman",serif;font-size:21px;margin-bottom:4px}.balance-range{color:var(--muted);margin-bottom:34px}.balance-card{background:rgba(255,255,255,.38);border:1px solid rgba(226,218,206,.65);border-radius:22px;padding:10px 16px}.balance-row{display:grid;grid-template-columns:54px 1fr 28px;gap:12px;align-items:center;padding:10px 0}.round-icon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:23px}.row-name{font-family:Georgia,"Times New Roman",serif;font-size:19px;margin-bottom:8px}.track{height:13px;background:#e9e4dc;border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px}.count{font-size:20px;text-align:right}
    .bottom{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);height:calc(72px + env(safe-area-inset-bottom));padding:9px 44px env(safe-area-inset-bottom);display:flex;justify-content:space-between;background:rgba(246,240,231,.95);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9a968e}.tab.active{color:var(--ink)}.tab-icon{font-size:25px}.tab-label{font-size:12px}
    .overlay{position:fixed;z-index:30;inset:0;background:rgba(30,30,25,.22);display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:min(520px,100%);background:var(--paper);border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.08)}.handle{width:50px;height:5px;border-radius:9px;background:#bbb5ac;margin:0 auto 20px}.sheet-head{display:flex;justify-content:space-between;align-items:flex-start}.sheet-title{font-size:27px;margin:0}.sheet-sub{color:var(--muted);margin:5px 0 16px}.close{border:0;background:#eae4db;width:40px;height:40px;border-radius:50%;font-size:25px}.option{width:100%;border:0;border-radius:16px;margin:8px 0;padding:10px 14px;display:grid;grid-template-columns:52px 1fr 24px;align-items:center;text-align:left;background:#eee}.option .round-icon{width:44px;height:44px}.option-name{font-family:Georgia,"Times New Roman",serif;font-size:19px}.radio{width:22px;height:22px;border:2px solid #aaa49a;border-radius:50%}.option.selected .radio{border:6px solid #20221d}.social-bg{background:#f1d4cc}.solo-bg{background:#dde1d5}.practical-bg{background:#f4dfb9}.hobbies-bg{background:#dde3e7}.rest-bg{background:#e6d9e9}.unassigned-bg{background:#e6e3dd}.social-i,.social-f{background:var(--social)}.solo-i,.solo-f{background:var(--solo)}.practical-i,.practical-f{background:var(--practical)}.hobbies-i,.hobbies-f{background:var(--hobbies)}.rest-i,.rest-f{background:var(--rest)}.unassigned-i,.unassigned-f{background:var(--unassigned)}
    @media(max-width:390px){.app{padding-left:10px;padding-right:10px}.grid,.weekdays{gap:4px}.day{font-size:15px}.month-title{font-size:25px}}
  </style>
</head>
<body>
<div class="app">
  <section id="calendarScreen" class="screen calendar-screen active">
    <div class="month-head"><button id="prev" class="nav-btn" aria-label="Previous month">‹</button><div id="monthTitle" class="month-title"></div><button id="next" class="nav-btn" aria-label="Next month">›</button></div>
    <div class="weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
    <div id="calendarGrid" class="grid"></div>
  </section>
  <section id="balanceScreen" class="screen balance-screen">
    <h1>Balance</h1><div class="balance-sub">Last 4 Completed Weekends</div><div id="balanceRange" class="balance-range"></div><div id="balanceCard" class="balance-card"></div>
  </section>
</div>
<nav class="bottom"><button class="tab active" data-screen="calendar"><span class="tab-icon">▣</span><span class="tab-label">Calendar</span></button><button class="tab" data-screen="balance"><span class="tab-icon">▥</span><span class="tab-label">Balance</span></button></nav>
<div id="overlay" class="overlay"><div class="sheet"><div class="handle"></div><div class="sheet-head"><div><h2 id="sheetTitle" class="sheet-title"></h2><div class="sheet-sub">Select a category</div></div><button id="close" class="close" aria-label="Close">×</button></div><div id="options"></div></div></div>
<script>
const CATS={social:{name:'Social',icon:'♙'},solo:{name:'Solo Fun',icon:'♡'},practical:{name:'Practical',icon:'⌂'},hobbies:{name:'Hobbies',icon:'\u2702\uFE0E'},rest:{name:'Rest',icon:'☾'},unassigned:{name:'Unassigned',icon:'○'}};
const ORDER=['social','solo','practical','hobbies','rest','unassigned'];
const START=new Date(2026,0,1), END=new Date(2029,11,31);
const pad=n=>String(n).padStart(2,'0'); const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let data={}; try{data=JSON.parse(localStorage.getItem('weekendBalanceData')||'{}')}catch(e){}
let today=new Date(); let current=(today<START)?new Date(START):(today>END?new Date(END):new Date(today.getFullYear(),today.getMonth(),1)); let selected=null;
function save(){localStorage.setItem('weekendBalanceData',JSON.stringify(data))}
function categoryFor(d){return data[key(d)]||'unassigned'}
function isWeekend(d){return d.getDay()===0||d.getDay()===6}
function renderCalendar(){const y=current.getFullYear(),m=current.getMonth(); monthTitle.textContent=current.toLocaleDateString('en-GB',{month:'long',year:'numeric'}); prev.disabled=(y===2026&&m===0); next.disabled=(y===2029&&m===11); calendarGrid.innerHTML=''; const first=new Date(y,m,1); const mondayIndex=(first.getDay()+6)%7; const days=new Date(y,m+1,0).getDate(); const prevDays=new Date(y,m,0).getDate(); for(let i=0;i<42;i++){let d, outside=false;if(i<mondayIndex){d=new Date(y,m-1,prevDays-mondayIndex+i+1);outside=true}else if(i>=mondayIndex+days){d=new Date(y,m+1,i-mondayIndex-days+1);outside=true}else d=new Date(y,m,i-mondayIndex+1); const b=document.createElement('button');b.className='day '+(outside?'outside ':''); b.innerHTML=`<span>${d.getDate()}</span>`; if(!outside&&isWeekend(d)){const c=categoryFor(d);b.className+=`weekend ${c}`;b.innerHTML+=`<span class="icon">${CATS[c].icon}</span>`;b.onclick=()=>openSelector(d)}else{b.className+='weekday';b.disabled=true} calendarGrid.appendChild(b)} }
function openSelector(d){selected=d; sheetTitle.textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});renderOptions();overlay.classList.add('open')}
function renderOptions(){options.innerHTML='';const active=categoryFor(selected);ORDER.forEach(c=>{const b=document.createElement('button');b.className=`option ${c}-bg ${active===c?'selected':''}`;b.innerHTML=`<span class="round-icon ${c}-i">${CATS[c].icon}</span><span class="option-name">${CATS[c].name}</span><span class="radio"></span>`;b.onclick=()=>{data[key(selected)]=c;save();overlay.classList.remove('open');renderCalendar();renderBalance()};options.appendChild(b)})}
function completedWeekendDates(){const now=new Date(); const monday=new Date(now); const day=(now.getDay()+6)%7; monday.setHours(0,0,0,0); monday.setDate(now.getDate()-day); const dates=[]; for(let w=1;w<=4;w++){const sat=new Date(monday);sat.setDate(monday.getDate()-2-7*(w-1));const sun=new Date(monday);sun.setDate(monday.getDate()-1-7*(w-1)); if(sat>=START){dates.push(sat);if(sun>=START)dates.push(sun)}} return dates.sort((a,b)=>a-b)}
function renderBalance(){const dates=completedWeekendDates();const counts=Object.fromEntries(ORDER.map(c=>[c,0]));dates.forEach(d=>counts[categoryFor(d)]++); if(dates.length){balanceRange.textContent=`${dates[0].toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} – ${dates.at(-1).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`}else balanceRange.textContent='No completed weekends yet'; balanceCard.innerHTML='';ORDER.forEach(c=>{const row=document.createElement('div');row.className='balance-row';const pct=dates.length?counts[c]/8*100:0;row.innerHTML=`<div class="round-icon ${c}-i">${CATS[c].icon}</div><div><div class="row-name">${CATS[c].name}</div><div class="track"><div class="fill ${c}-f" style="width:${pct}%"></div></div></div><div class="count">${counts[c]}</div>`;balanceCard.appendChild(row)})}
prev.onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()-1,1);renderCalendar()};next.onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()+1,1);renderCalendar()};close.onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));calendarScreen.classList.toggle('active',t.dataset.screen==='calendar');balanceScreen.classList.toggle('active',t.dataset.screen==='balance');if(t.dataset.screen==='balance')renderBalance()});
renderCalendar();renderBalance(); if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
